server.port=8085
spring.application.name=taxi-fleet

# ============================================================
#  Configuration de la base de donnees
#  Valeurs par defaut : H2 sur fichier (aucune installation requise)
#  Pour utiliser MariaDB en local : voir application-local.properties
#  (ce fichier est ignore par git et charge via l'import ci-dessous)
#  Surcharge possible via variables d'environnement : DB_URL / DB_USERNAME / DB_PASSWORD
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taxidb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Console H2 (accessible sur /h2-console en mode H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Mot de passe des comptes de demonstration (modifiable localement)
app.demo-data.password=${DEMO_PASSWORD:password}

# ============================================================
#  Import du fichier de configuration local (non publie)
#  Le prefixe "optional:" evite une erreur si le fichier est absent
# ============================================================
spring.config.import=optional:file:application-local.properties
