<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Clients')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="main" id="contenu">

    <div class="page-title">
        <div>
            <h1>Clients</h1>
            <p class="sub">Carnet d'adresses de la clientèle</p>
        </div>
        <a class="btn btn-ripple" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')"
           th:href="@{/clients/new}">+ Nouveau client</a>
    </div>

    <form class="filter-bar" th:action="@{/clients}" method="get">
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="Nom, téléphone, email…" aria-label="Rechercher un client">
        <input type="hidden" name="sort" th:value="${sort}">
        <button class="btn btn-ghost" type="submit">Filtrer</button>
        <a class="btn btn-ghost" th:href="@{/clients}">Réinitialiser</a>
    </form>

    <div class="table-wrap" data-aos="fade-up">
        <table class="data row-hover">
            <caption class="sr-only">Liste des clients, triable et filtrable</caption>
            <thead>
            <tr>
                <th scope="col" class="sortable"
                    th:classappend="${sort != null and sort.startsWith('name') ? (sort.endsWith('desc') ? 'sorted' : 'sorted asc') : ''}"
                    <a th:href="@{/clients(keyword=${keyword},sort=${sort != null and sort.startsWith('name') ? (sort.endsWith('desc') ? 'name,asc' : 'name,desc') : 'name,asc'})}">Client</a>
                </th>
                <th scope="col" class="sortable"
                    th:classappend="${sort != null and sort.startsWith('phone') ? (sort.endsWith('desc') ? 'sorted' : 'sorted asc') : ''}"
                    <a th:href="@{/clients(keyword=${keyword},sort=${sort != null and sort.startsWith('phone') ? (sort.endsWith('desc') ? 'phone,asc' : 'phone,desc') : 'phone,asc'})}">Téléphone</a>
                </th>
                <th scope="col" class="sortable"
                    th:classappend="${sort != null and sort.startsWith('email') ? (sort.endsWith('desc') ? 'sorted' : 'sorted asc') : ''}"
                    <a th:href="@{/clients(keyword=${keyword},sort=${sort != null and sort.startsWith('email') ? (sort.endsWith('desc') ? 'email,asc' : 'email,desc') : 'email,asc'})}">Email</a>
                </th>
                <th scope="col">Adresse</th>
                <th scope="col" class="sortable"
                    th:classappend="${sort != null and sort.startsWith('createdAt') ? (sort.endsWith('desc') ? 'sorted' : 'sorted asc') : ''}"
                    <a th:href="@{/clients(keyword=${keyword},sort=${sort != null and sort.startsWith('createdAt') ? (sort.endsWith('desc') ? 'createdAt,asc' : 'createdAt,desc') : 'createdAt,desc'})}">Client depuis</a>
                </th>
                <th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${page.content}">
                <td class="cell-strong" th:text="${c.name()}">Nom</td>
                <td class="cell-nowrap" th:text="${c.phone()}">06 00 00 00 00</td>
                <td th:text="${c.email() ?: '—'}">email@exemple.fr</td>
                <td th:text="${c.address() ?: '—'}">Adresse</td>
                <td class="cell-nowrap" th:text="${#temporals.format(c.createdAt(),'dd/MM/yyyy')}">date</td>
                <td>
                    <div class="actions">
                        <a class="btn btn-outline btn-sm" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')"
                           th:href="@{/clients/{id}/edit(id=${c.id()})}">Éditer</a>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/clients/{id}/delete(id=${c.id()})}" method="post"
                              data-confirm="Supprimer définitivement ce client ?">
                            <button type="submit" class="btn btn-danger btn-sm">Suppr.</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${page.content.isEmpty()}">
                <td colspan="6" class="cell-empty">Aucun client ne correspond aux critères.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pager" th:if="${page.totalPages > 1}">
        <div class="pager-info" th:text="${page.totalElements} + ' résultat(s)'">0 résultat(s)</div>
        <nav class="pager-nav" aria-label="Pagination">
            <a class="btn btn-ghost btn-sm" th:classappend="${page.number == 0 ? 'disabled' : ''}"
               th:href="@{/clients(keyword=${keyword},sort=${sort},page=${page.number - 1})}"
               aria-label="Page précédente">←</a>
            <span class="pager-current" aria-current="page"
                  th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
            <a class="btn btn-ghost btn-sm" th:classappend="${page.last ? 'disabled' : ''}"
               th:href="@{/clients(keyword=${keyword},sort=${sort},page=${page.number + 1})}"
               aria-label="Page suivante">→</a>
        </nav>
    </div>
</main>
</body>
</html>
